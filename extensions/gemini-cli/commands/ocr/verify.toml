description = "Verify a ScholarOCR extraction and check uncertain elements against the source. Usage: /ocr:verify <document_id or file name>"
prompt = """
Verify this ScholarOCR document: {{args}}

1. If the argument is not a document_id, find it with list_documents. If several documents
   match, ask me which one.
2. Call verify_document with the default scope. Do not set review=true unless I asked for a
   review pass, because it spends model calls.
3. Summarize findings grouped by severity (error, warning, info), with page numbers and
   element ids. Errors must not be glossed over.
4. For each element with uncertainty high or unresolved (at most 5, ask before doing more),
   call get_source_region and compare the original crop with the extracted content. Say
   whether the extraction matches what you see. Never fill in unresolved text as if it were
   read by the engine; if you read it yourself from the crop, say so explicitly.
5. End with a one-line verdict: is the extraction safe to rely on for my task, and what
   should be re-checked.

Uncertainty labels are ordinal, not probabilities. Do not turn them into percentages.
"""
